# Unit tests on every push to main and every pull request (CPU JAX, float64 by default plus float32 subprocess tests).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (hep-simlib first, it is not on PyPI; the tested JAX/NumPy/SciPy from 3.12, NumPy only below)
        run: |
          case "${{ matrix.python-version }}" in 3.10|3.11) ;; *) python -m pip install -r ci/requirements.txt ;; esac
          python -m pip install 'hep-simlib @ git+https://github.com/RobMina/hep-simlib.git@b5868350f789f49dfc174110e72d55a40758de67'
          python -m pip install -e '.[test]'
      - name: Test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -p no:cacheprovider

  citation:
    name: citation metadata (CITATION.cff, .zenodo.json)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate CITATION.cff and check the versions agree with pyproject.toml
        run: |
          python -m pip install -q cffconvert==2.0.0 pyyaml
          cffconvert --validate
          python - <<'PY'
          import json, tomllib, yaml
          v = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          z = json.load(open(".zenodo.json"))["version"]
          c = str(yaml.safe_load(open("CITATION.cff"))["version"])
          assert v == z == c, (v, z, c)
          print("version", v)
          PY
